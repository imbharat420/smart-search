[project]
name = "shopsense-api"
version = "0.1.0"
description = "ShopSense — FastAPI RAG backend for the semantic product search + chat frontend"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.50",
    "numpy>=1.26",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.4",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv]
package = false
